<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawaiian Circular Diagram</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            /* Animated gradient background */
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
        }

        /* Smooth gradient animation for background atmosphere */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Loading screen - displays while page initializes */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Spinning loader with Hawaiian color scheme */
        .loader {
            width: 80px;
            height: 80px;
            border: 6px solid #2d2d2d;
            border-top: 6px solid #8B1A1A;
            border-right: 6px solid #D4A574;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: #D4A574;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 800px;
            max-height: 800px;
            /* Performance: GPU acceleration for container */
            will-change: transform;
        }

        /* Central Circle - Performance optimized with will-change */
        .central-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: #8B1A1A;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(139, 26, 26, 0.5),
                        inset 0 0 20px rgba(0, 0, 0, 0.3);
            border: 4px solid #D4A574;
            z-index: 10;
            /* Performance: Optimize for transform and box-shadow animations */
            will-change: transform, box-shadow;
        }

        .bird-container {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bird-svg {
            width: 100%;
            height: 100%;
            fill: #D4A574;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Element Circles - Performance optimized for smooth interactions */
        .element {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #D4A574;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #8B1A1A;
            cursor: pointer;
            transition: transform 0.3s ease;
            /* Performance: Enable GPU acceleration for smooth scaling */
            will-change: transform;
            backface-visibility: hidden;
        }

        .element:hover {
            transform: scale(1.1);
        }

        .element-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 8px;
        }

        .element-label {
            color: #8B1A1A;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        /* Positioning elements around the circle */
        .element-top {
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .element-bottom {
            bottom: 0;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .element-left {
            left: 0;
            top: 50%;
            transform: translate(0, -50%);
        }

        .element-right {
            right: 0;
            top: 50%;
            transform: translate(0, -50%);
        }

        .element-upper-right {
            top: 12%;
            right: 12%;
        }

        .element-lower-right {
            bottom: 12%;
            right: 12%;
        }

        /* Connecting Lines */
        .connection-line {
            position: absolute;
            background: #D4A574;
            opacity: 0.3;
            z-index: 1;
        }

        .line-top {
            width: 3px;
            height: calc(50% - 100px);
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
        }

        .line-bottom {
            width: 3px;
            height: calc(50% - 100px);
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
        }

        .line-left {
            height: 3px;
            width: calc(50% - 100px);
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
        }

        .line-right {
            height: 3px;
            width: calc(50% - 100px);
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
        }

        .line-upper-right {
            width: 3px;
            height: 180px;
            top: 100px;
            right: calc(12% + 60px);
            transform: rotate(45deg);
            transform-origin: top center;
        }

        .line-lower-right {
            width: 3px;
            height: 180px;
            bottom: 100px;
            right: calc(12% + 60px);
            transform: rotate(-45deg);
            transform-origin: bottom center;
        }

        /* Geometric Patterns - Performance optimized for continuous animation */
        .pattern-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            /* Performance: Optimize for opacity and transform changes */
            will-change: opacity, transform;
        }

        /* Add floating animation for pattern container */
        @keyframes floatPattern {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            25% {
                transform: translateY(-10px) translateX(5px);
            }
            50% {
                transform: translateY(0) translateX(10px);
            }
            75% {
                transform: translateY(10px) translateX(5px);
            }
        }

        /* Particle System */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        /* Spiral Patterns Container */
        .spiral-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* Morphing Shapes */
        .morphing-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .morphing-shape {
            position: absolute;
        }

        /* Parallax Layers */
        .parallax-layer {
            transition: transform 0.1s ease-out;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .element {
                width: 100px;
                height: 100px;
            }

            .element-icon {
                width: 40px;
                height: 40px;
            }

            .element-label {
                font-size: 12px;
            }

            .central-circle {
                width: 160px;
                height: 160px;
            }

            .bird-container {
                width: 80px;
                height: 80px;
            }
        }

        @media (max-width: 480px) {
            .element {
                width: 80px;
                height: 80px;
            }

            .element-icon {
                width: 30px;
                height: 30px;
            }

            .element-label {
                font-size: 10px;
            }

            .central-circle {
                width: 120px;
                height: 120px;
            }

            .bird-container {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen - Displayed during initialization -->
    <div class="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">LOADING...</div>
    </div>

    <div class="container">
        <!-- Morphing Shapes Layer -->
        <svg class="morphing-shapes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
            <!-- Morphing shapes that transition between triangles and circles -->
            <g class="morphing-shape" transform="translate(150, 150)">
                <circle cx="0" cy="0" r="30" fill="#D4A574" opacity="0.3"/>
            </g>
            <g class="morphing-shape" transform="translate(650, 150)">
                <circle cx="0" cy="0" r="30" fill="#8B1A1A" opacity="0.3"/>
            </g>
            <g class="morphing-shape" transform="translate(150, 650)">
                <circle cx="0" cy="0" r="30" fill="#D4A574" opacity="0.3"/>
            </g>
            <g class="morphing-shape" transform="translate(650, 650)">
                <circle cx="0" cy="0" r="30" fill="#8B1A1A" opacity="0.3"/>
            </g>
        </svg>

        <!-- Spiral Patterns -->
        <svg class="spiral-container" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
            <defs>
                <radialGradient id="spiralGradient">
                    <stop offset="0%" style="stop-color:#D4A574;stop-opacity:0.6"/>
                    <stop offset="100%" style="stop-color:#D4A574;stop-opacity:0"/>
                </radialGradient>
            </defs>
            <!-- Spirals will be dynamically created -->
        </svg>

        <!-- Background patterns -->
        <svg class="pattern-container parallax-layer" data-speed="0.5" xmlns="http://www.w3.org/2000/svg">
            <!-- Spiral patterns -->
            <path d="M 400 400 Q 420 380, 440 400 T 480 400 T 520 400"
                  fill="none" stroke="#8B1A1A" stroke-width="2" opacity="0.2"/>
            <path d="M 400 400 Q 380 420, 400 440 T 400 480 T 400 520"
                  fill="none" stroke="#8B1A1A" stroke-width="2" opacity="0.2"/>

            <!-- Triangles -->
            <polygon points="100,100 120,140 80,140" fill="#D4A574" opacity="0.15"/>
            <polygon points="700,100 720,140 680,140" fill="#D4A574" opacity="0.15"/>
            <polygon points="100,700 120,740 80,740" fill="#D4A574" opacity="0.15"/>
            <polygon points="700,700 720,740 680,740" fill="#D4A574" opacity="0.15"/>

            <!-- Chevrons -->
            <path d="M 50 400 L 80 380 L 80 420 Z" fill="#8B1A1A" opacity="0.2"/>
            <path d="M 750 400 L 720 380 L 720 420 Z" fill="#8B1A1A" opacity="0.2"/>
        </svg>

        <!-- Connecting lines -->
        <div class="connection-line line-top parallax-layer" data-speed="0.8"></div>
        <div class="connection-line line-bottom parallax-layer" data-speed="0.8"></div>
        <div class="connection-line line-left parallax-layer" data-speed="0.8"></div>
        <div class="connection-line line-right parallax-layer" data-speed="0.8"></div>
        <div class="connection-line line-upper-right parallax-layer" data-speed="0.8"></div>
        <div class="connection-line line-lower-right parallax-layer" data-speed="0.8"></div>

        <!-- Central Circle with Bird -->
        <div class="central-circle parallax-layer" data-speed="1.2">
            <div class="bird-container">
                <svg class="bird-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Hawaiian bird (simplified 'Iwa / frigate bird) -->
                    <path d="M 50 30 Q 40 35, 20 25 Q 15 20, 20 15 Q 30 20, 40 25 L 45 35
                             Q 48 25, 50 20 Q 52 25, 55 35 L 60 25 Q 70 20, 80 15 Q 85 20, 80 25
                             Q 60 35, 50 30 Z M 50 35 L 45 55 L 50 70 L 55 55 Z
                             M 45 55 L 35 60 L 40 65 M 55 55 L 65 60 L 60 65"/>
                    <circle cx="45" cy="32" r="2"/>
                    <circle cx="55" cy="32" r="2"/>
                </svg>
            </div>
        </div>

        <!-- Element: Top -->
        <div class="element element-top parallax-layer" data-speed="1.0">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Chevron pattern -->
                <path d="M 20 50 L 50 20 L 80 50" fill="none" stroke="#8B1A1A" stroke-width="6"/>
                <path d="M 20 70 L 50 40 L 80 70" fill="none" stroke="#8B1A1A" stroke-width="6"/>
            </svg>
            <div class="element-label">Lani<br>(Heaven)</div>
        </div>

        <!-- Element: Bottom -->
        <div class="element element-bottom parallax-layer" data-speed="1.0">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Triangle pattern -->
                <polygon points="50,20 80,70 20,70" fill="#8B1A1A"/>
                <polygon points="50,40 65,70 35,70" fill="#D4A574"/>
            </svg>
            <div class="element-label">Honua<br>(Earth)</div>
        </div>

        <!-- Element: Left -->
        <div class="element element-left parallax-layer" data-speed="1.0">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Spiral pattern -->
                <path d="M 50 50 Q 50 30, 70 30 Q 80 30, 80 40 Q 80 60, 60 60 Q 30 60, 30 40 Q 30 20, 50 20"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
                <circle cx="50" cy="50" r="5" fill="#8B1A1A"/>
            </svg>
            <div class="element-label">Kai<br>(Ocean)</div>
        </div>

        <!-- Element: Right -->
        <div class="element element-right parallax-layer" data-speed="1.0">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Geometric pattern -->
                <rect x="30" y="30" width="15" height="15" fill="#8B1A1A"/>
                <rect x="55" y="30" width="15" height="15" fill="#8B1A1A"/>
                <rect x="30" y="55" width="15" height="15" fill="#8B1A1A"/>
                <rect x="55" y="55" width="15" height="15" fill="#8B1A1A"/>
                <circle cx="50" cy="50" r="8" fill="#8B1A1A"/>
            </svg>
            <div class="element-label">Aina<br>(Land)</div>
        </div>

        <!-- Element: Upper Right -->
        <div class="element element-upper-right parallax-layer" data-speed="1.0">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Sun rays -->
                <circle cx="50" cy="50" r="15" fill="#8B1A1A"/>
                <line x1="50" y1="20" x2="50" y2="30" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="50" y1="70" x2="50" y2="80" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="20" y1="50" x2="30" y2="50" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="70" y1="50" x2="80" y2="50" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="30" y1="30" x2="37" y2="37" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="63" y1="63" x2="70" y2="70" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="70" y1="30" x2="63" y2="37" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="37" y1="63" x2="30" y2="70" stroke="#8B1A1A" stroke-width="4"/>
            </svg>
            <div class="element-label">La<br>(Sun)</div>
        </div>

        <!-- Element: Lower Right -->
        <div class="element element-lower-right parallax-layer" data-speed="1.0">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Wave pattern -->
                <path d="M 10 40 Q 25 30, 40 40 T 70 40 T 90 40"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
                <path d="M 10 55 Q 25 45, 40 55 T 70 55 T 90 55"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
                <path d="M 10 70 Q 25 60, 40 70 T 70 70 T 90 70"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
            </svg>
            <div class="element-label">Mana<br>(Spirit)</div>
        </div>
    </div>

    <script>
        // ====================================================================
        // CUSTOM EASING FUNCTIONS
        // ====================================================================
        // Define custom cubic-bezier easing for smooth, natural motion
        // Format: cubic-bezier(x1, y1, x2, y2) - control points for Bézier curve

        const customEasing = {
            // Smooth elastic bounce - great for appearing elements
            elasticOut: 'cubicBezier(0.68, -0.55, 0.265, 1.55)',
            // Gentle spring effect - natural feeling motion
            spring: 'spring(1, 80, 10, 0)',
            // Smooth deceleration - polished exits
            smoothOut: 'cubicBezier(0.25, 0.46, 0.45, 0.94)',
            // Quick acceleration with smooth finish
            quickSnap: 'cubicBezier(0.4, 0.0, 0.2, 1)',
            // Anticipation effect - pulls back before moving forward
            anticipate: 'cubicBezier(0.36, 0, 0.66, -0.56)'
        };

        // ====================================================================
        // LOADING ANIMATION & PAGE INITIALIZATION
        // ====================================================================
        // Hide loading screen after a brief delay to ensure smooth transitions
        // This creates a professional loading experience

        window.addEventListener('load', function() {
            // Small delay ensures all resources are ready
            setTimeout(() => {
                const loadingScreen = document.querySelector('.loading-screen');
                loadingScreen.classList.add('hidden');

                // Start main animation sequence after loading screen fades
                setTimeout(() => {
                    initIntroSequence();
                }, 500);
            }, 800);
        });

        // ====================================================================
        // INTRO SEQUENCE - Initial appearance of all elements
        // ====================================================================
        // Animation sequence: Central circle → Connection lines → Element circles
        // Uses elastic easing for playful, energetic entrance

        function initIntroSequence() {
            const introTimeline = anime.timeline({
                loop: false,
                easing: 'easeOutElastic(1, .8)'
            });

            // STEP 1: Central circle appears with elastic bounce
            // Scale from 0 to 1 creates a "pop" effect
            introTimeline.add({
                targets: '.central-circle',
                scale: [0, 1],
                opacity: [0, 1],
                duration: 1000,
                easing: 'easeOutElastic(1, .8)',
                begin: function() {
                    // Ensure element is visible before animation starts
                    document.querySelector('.central-circle').style.opacity = 1;
                }
            });

            // STEP 2: Connection lines grow from center outward
            // Stagger creates sequential appearance (200ms between each line)
            introTimeline.add({
                targets: '.connection-line',
                scaleY: [0, 1],
                opacity: [0, 0.3],
                duration: 700,
                delay: anime.stagger(150),
                easing: 'easeOutCubic'
            }, '-=500'); // Start 500ms before previous animation ends (overlap)

            // STEP 3: Element circles appear with staggered elastic bounce
            // from: 'center' makes closest elements appear first
            introTimeline.add({
                targets: '.element',
                scale: [0, 1],
                opacity: [0, 1],
                duration: 800,
                delay: anime.stagger(150, {from: 'center'}),
                easing: 'easeOutElastic(1, .6)',
                complete: function() {
                    // After intro completes, start idle state animations
                    initIdleState();
                }
            }, '-=400');
        }

        // ====================================================================
        // IDLE STATE - Continuous subtle animations when no interaction
        // ====================================================================
        // These animations create a "living" feeling without being distracting
        // All use smooth, slow easings for calm, meditative effect

        function initIdleState() {
            // BIRD ROTATION: Slow, continuous 360° rotation (8 seconds per rotation)
            // easeInOutQuad provides smooth acceleration and deceleration
            anime({
                targets: '.bird-svg',
                rotate: 360,
                duration: 8000,
                loop: true,
                easing: 'easeInOutQuad'
            });

            // CENTRAL CIRCLE GLOW PULSE: Creates breathing effect
            // Alternates between subtle and prominent shadow
            anime({
                targets: '.central-circle',
                boxShadow: [
                    '0 0 30px rgba(139, 26, 26, 0.5)',
                    '0 0 50px rgba(139, 26, 26, 0.8)',
                    '0 0 30px rgba(139, 26, 26, 0.5)'
                ],
                duration: 3000,
                loop: true,
                easing: 'easeInOutSine' // Sine wave creates natural breathing rhythm
            });

            // ELEMENT SUBTLE FLOAT: Gentle up/down motion
            // Adds life to static elements without being distracting
            anime({
                targets: '.element',
                translateY: [0, -5, 0],
                duration: 4000,
                loop: true,
                delay: anime.stagger(300), // Each element floats at different times
                easing: 'easeInOutSine'
            });

            // PATTERN STROKE ANIMATION: Line drawing effect
            // Creates hypnotic, flowing motion in background patterns
            initPatternAnimations();

            // BACKGROUND PATTERN MOVEMENT: Subtle floating motion
            // Adds depth and dimension to the background
            anime({
                targets: '.pattern-container',
                translateY: [0, -10, 0],
                translateX: [0, 5, 0],
                duration: 20000,
                loop: true,
                easing: 'easeInOutSine'
            });
        }

        // ====================================================================
        // PATTERN ANIMATIONS - Background geometric pattern effects
        // ====================================================================
        // Animate SVG stroke paths to create drawing effect
        // Opacity pulsing adds visual interest without distraction

        function initPatternAnimations() {
            // Setup stroke dasharray for line drawing animation
            // This technique makes paths appear to "draw themselves"
            const paths = document.querySelectorAll('.pattern-container path');
            paths.forEach(path => {
                const pathLength = path.getTotalLength();
                path.style.strokeDasharray = pathLength;
                path.style.strokeDashoffset = pathLength;
            });

            // STROKE DRAWING: Paths draw and undraw continuously
            // alternate direction creates seamless loop
            anime({
                targets: '.pattern-container path',
                strokeDashoffset: [anime.setDashoffset, 0],
                duration: 3000,
                delay: anime.stagger(400), // Sequential drawing
                easing: 'easeInOutQuad',
                loop: true,
                direction: 'alternate'
            });

            // POLYGON OPACITY PULSE: Subtle fade in/out
            // Creates gentle twinkling effect
            anime({
                targets: '.pattern-container polygon',
                opacity: [0.15, 0.3, 0.15],
                duration: 4000,
                loop: true,
                easing: 'easeInOutSine',
                delay: anime.stagger(300)
            });
        }

        // ====================================================================
        // INTERACTION STATES - Mouse hover and click responses
        // ====================================================================
        // These animations provide immediate feedback to user actions
        // Using spring physics creates natural, satisfying interactions

        // Setup hover interactions for all element circles
        document.querySelectorAll('.element').forEach(element => {
            // HOVER ENTER: Scale up with spring bounce
            element.addEventListener('mouseenter', function() {
                // Stop any ongoing idle float animation for this element
                anime.remove(this);

                // Scale element to 1.15x with spring easing
                // Spring physics creates satisfying bounce
                anime({
                    targets: this,
                    scale: 1.15,
                    duration: 600,
                    easing: 'spring(1, 80, 10, 0)' // Spring with natural bounce
                });

                // Rotate icon 360° with smooth ease
                // Creates playful, engaging interaction
                anime({
                    targets: this.querySelector('.element-icon'),
                    rotate: [0, 360],
                    duration: 800,
                    easing: 'easeInOutCubic'
                });

                // Brighten element shadow for depth
                anime({
                    targets: this,
                    boxShadow: '0 8px 25px rgba(0, 0, 0, 0.5)',
                    duration: 300,
                    easing: 'easeOutQuad'
                });
            });

            // HOVER LEAVE: Return to normal state
            element.addEventListener('mouseleave', function() {
                // Smooth return to idle state
                anime({
                    targets: this,
                    scale: 1,
                    duration: 400,
                    easing: 'easeOutCubic'
                });

                // Restore original shadow
                anime({
                    targets: this,
                    boxShadow: '0 4px 15px rgba(0, 0, 0, 0.3)',
                    duration: 300,
                    easing: 'easeOutQuad'
                });

                // Resume idle float animation
                anime({
                    targets: this,
                    translateY: [0, -5, 0],
                    duration: 4000,
                    loop: true,
                    easing: 'easeInOutSine'
                });
            });

            // CLICK: Emphatic bounce feedback
            element.addEventListener('click', function() {
                // Quick scale down then up creates "press" effect
                anime({
                    targets: this,
                    scale: [1.15, 0.95, 1.15],
                    duration: 400,
                    easing: 'easeOutElastic(1, .5)'
                });

                // Flash effect on icon
                anime({
                    targets: this.querySelector('.element-icon'),
                    opacity: [1, 0.5, 1],
                    duration: 300,
                    easing: 'easeInOutQuad'
                });
            });
        });

        // ====================================================================
        // CENTRAL CIRCLE INTERACTION - Special hover effect for main element
        // ====================================================================
        const centralCircle = document.querySelector('.central-circle');

        centralCircle.addEventListener('mouseenter', function() {
            // Grow central circle and intensify glow
            anime({
                targets: this,
                scale: 1.05,
                duration: 500,
                easing: 'easeOutElastic(1, .8)'
            });

            // Speed up bird rotation on hover for playful interaction
            anime.remove('.bird-svg'); // Stop current rotation
            anime({
                targets: '.bird-svg',
                rotate: 360,
                duration: 2000, // Faster than idle (was 8000)
                loop: true,
                easing: 'linear'
            });
        });

        centralCircle.addEventListener('mouseleave', function() {
            // Return to normal size
            anime({
                targets: this,
                scale: 1,
                duration: 500,
                easing: 'easeOutCubic'
            });

            // Restore normal bird rotation speed
            anime.remove('.bird-svg');
            anime({
                targets: '.bird-svg',
                rotate: 360,
                duration: 8000,
                loop: true,
                easing: 'easeInOutQuad'
            });
        });

        // ====================================================================
        // PERFORMANCE OPTIMIZATION
        // ====================================================================
        // Monitor frame rate and adjust animation quality if needed
        // Ensures 60fps on all devices

        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 60;

        function checkPerformance() {
            frameCount++;
            const currentTime = performance.now();

            // Calculate FPS every second
            if (currentTime >= lastTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                frameCount = 0;
                lastTime = currentTime;

                // If FPS drops below 50, reduce animation complexity
                if (fps < 50) {
                    console.log('Performance optimization: Reducing animation complexity');
                    // Disable some background animations
                    anime.remove('.pattern-container');
                }
            }

            requestAnimationFrame(checkPerformance);
        }

        // Start performance monitoring
        requestAnimationFrame(checkPerformance);

        // ====================================================================
        // ACCESSIBILITY - Respect user's motion preferences
        // ====================================================================
        // Disable animations if user prefers reduced motion

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            // Stop all anime.js animations
            anime.running.forEach(anim => anim.pause());
            console.log('Reduced motion mode: Animations paused');
        }
        // ===== SOPHISTICATED ANIMATIONS =====

        // 1. PARTICLE SYSTEM: Dots flowing from outer elements to center
        const container = document.querySelector('.container');
        const containerRect = container.getBoundingClientRect();
        const centerX = containerRect.width / 2;
        const centerY = containerRect.height / 2;

        function createParticle(startX, startY) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            particle.style.width = (Math.random() * 4 + 2) + 'px';
            particle.style.height = particle.style.width;
            particle.style.background = Math.random() > 0.5 ? '#D4A574' : '#8B1A1A';
            particle.style.opacity = Math.random() * 0.6 + 0.3;
            container.appendChild(particle);

            // Animate particle from outer element to center
            anime({
                targets: particle,
                left: centerX,
                top: centerY,
                opacity: [particle.style.opacity, 0],
                duration: Math.random() * 2000 + 2000,
                easing: 'easeInQuad',
                complete: () => particle.remove()
            });
        }

        // Generate particles continuously from each element
        function generateParticlesFromElements() {
            const elements = document.querySelectorAll('.element');
            elements.forEach(element => {
                const rect = element.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const startX = rect.left - containerRect.left + rect.width / 2;
                const startY = rect.top - containerRect.top + rect.height / 2;

                // Create particle with random offset
                const offsetX = (Math.random() - 0.5) * 40;
                const offsetY = (Math.random() - 0.5) * 40;
                createParticle(startX + offsetX, startY + offsetY);
            });
        }

        // Generate particles every 500ms
        setInterval(generateParticlesFromElements, 500);

        // 2. SPIRAL PATTERNS: Animate outward from center when clicked
        const spiralContainer = document.querySelector('.spiral-container');
        const centralCircle = document.querySelector('.central-circle');
        let spiralCounter = 0;

        function createSpiral() {
            spiralCounter++;
            const spiralId = 'spiral-' + spiralCounter;

            // Create spiral path using parametric equation
            let pathData = 'M 400 400 ';
            const turns = 3;
            const maxRadius = 300;
            const points = 50;

            for (let i = 0; i <= points; i++) {
                const t = i / points;
                const angle = t * turns * Math.PI * 2;
                const radius = t * maxRadius;
                const x = 400 + radius * Math.cos(angle);
                const y = 400 + radius * Math.sin(angle);
                pathData += `L ${x} ${y} `;
            }

            const spiral = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            spiral.setAttribute('d', pathData);
            spiral.setAttribute('fill', 'none');
            spiral.setAttribute('stroke', 'url(#spiralGradient)');
            spiral.setAttribute('stroke-width', '3');
            spiral.setAttribute('opacity', '0');
            spiral.setAttribute('id', spiralId);
            spiralContainer.appendChild(spiral);

            // Animate spiral drawing outward
            const pathLength = spiral.getTotalLength();
            spiral.style.strokeDasharray = pathLength;
            spiral.style.strokeDashoffset = pathLength;

            anime.timeline()
                .add({
                    targets: spiral,
                    strokeDashoffset: [pathLength, 0],
                    opacity: [0, 0.8, 0],
                    duration: 3000,
                    easing: 'easeOutQuad',
                    complete: () => spiral.remove()
                });
        }

        // Create spiral on central circle click
        centralCircle.addEventListener('click', createSpiral);

        // Auto-generate spirals occasionally
        setInterval(() => {
            if (Math.random() > 0.7) {
                createSpiral();
            }
        }, 5000);

        // 3. CONNECTION LINES: Enhanced draw/undraw animation
        const connectionLines = document.querySelectorAll('.connection-line');

        // Animate connection lines with pulsing effect
        anime({
            targets: '.connection-line',
            opacity: [0.3, 0.7, 0.3],
            duration: 3000,
            loop: true,
            easing: 'easeInOutSine',
            delay: anime.stagger(400)
        });

        // Add drawing effect on hover
        document.querySelectorAll('.element').forEach((element, index) => {
            element.addEventListener('mouseenter', function() {
                const lines = document.querySelectorAll('.connection-line');
                anime({
                    targets: lines[index],
                    opacity: 1,
                    duration: 300,
                    easing: 'easeOutQuad'
                });
            });

            element.addEventListener('mouseleave', function() {
                const lines = document.querySelectorAll('.connection-line');
                anime({
                    targets: lines[index],
                    opacity: 0.3,
                    duration: 500,
                    easing: 'easeOutQuad'
                });
            });
        });

        // 4. MORPHING SHAPES: Transition between triangles and circles
        const morphingShapes = document.querySelectorAll('.morphing-shape');

        morphingShapes.forEach((shape, index) => {
            const circle = shape.querySelector('circle');
            const isGold = index % 2 === 0;

            // Create triangle path for morphing
            const trianglePath = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            trianglePath.setAttribute('points', '0,-30 26,15 -26,15');
            trianglePath.setAttribute('fill', isGold ? '#D4A574' : '#8B1A1A');
            trianglePath.setAttribute('opacity', '0');
            shape.appendChild(trianglePath);

            // Morph between circle and triangle
            anime.timeline({ loop: true })
                .add({
                    targets: circle,
                    opacity: [0.3, 0],
                    scale: [1, 0.8],
                    duration: 1500,
                    easing: 'easeInOutQuad'
                })
                .add({
                    targets: trianglePath,
                    opacity: [0, 0.3],
                    scale: [0.8, 1],
                    rotate: [0, 120],
                    duration: 1500,
                    easing: 'easeInOutQuad'
                }, '-=1500')
                .add({
                    targets: trianglePath,
                    opacity: [0.3, 0],
                    scale: [1, 0.8],
                    rotate: [120, 240],
                    duration: 1500,
                    easing: 'easeInOutQuad',
                    delay: 1000
                })
                .add({
                    targets: circle,
                    opacity: [0, 0.3],
                    scale: [0.8, 1],
                    duration: 1500,
                    easing: 'easeInOutQuad'
                }, '-=1500');
        });

        // Add rotation animation to morphing shapes
        anime({
            targets: '.morphing-shape',
            rotate: 360,
            duration: 20000,
            loop: true,
            easing: 'linear',
            delay: anime.stagger(1000)
        });

        // 5. PARALLAX EFFECT: Different layers move at different speeds on mouse move
        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;

        document.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouseX = (e.clientX - rect.left - rect.width / 2) / rect.width;
            mouseY = (e.clientY - rect.top - rect.height / 2) / rect.height;
        });

        // Smooth parallax animation loop
        function animateParallax() {
            currentX += (mouseX - currentX) * 0.1;
            currentY += (mouseY - currentY) * 0.1;

            const parallaxLayers = document.querySelectorAll('.parallax-layer');
            parallaxLayers.forEach(layer => {
                const speed = parseFloat(layer.getAttribute('data-speed') || 1);
                const x = currentX * 50 * speed;
                const y = currentY * 50 * speed;

                // Get current transform and preserve it
                const computedStyle = window.getComputedStyle(layer);
                const matrix = computedStyle.transform;

                if (layer.classList.contains('element-top')) {
                    layer.style.transform = `translate(calc(-50% + ${x}px), ${y}px)`;
                } else if (layer.classList.contains('element-bottom')) {
                    layer.style.transform = `translate(calc(-50% + ${x}px), ${y}px)`;
                } else if (layer.classList.contains('element-left')) {
                    layer.style.transform = `translate(${x}px, calc(-50% + ${y}px))`;
                } else if (layer.classList.contains('element-right')) {
                    layer.style.transform = `translate(${x}px, calc(-50% + ${y}px))`;
                } else if (layer.classList.contains('central-circle')) {
                    layer.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                } else if (layer.classList.contains('line-top')) {
                    layer.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px)`;
                } else if (layer.classList.contains('line-bottom')) {
                    layer.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px)`;
                } else if (layer.classList.contains('line-left')) {
                    layer.style.transform = `translateY(calc(-50% + ${y}px)) translateX(${x}px)`;
                } else if (layer.classList.contains('line-right')) {
                    layer.style.transform = `translateY(calc(-50% + ${y}px)) translateX(${x}px)`;
                } else if (layer.classList.contains('line-upper-right')) {
                    layer.style.transform = `rotate(45deg) translate(${x}px, ${y}px)`;
                } else if (layer.classList.contains('line-lower-right')) {
                    layer.style.transform = `rotate(-45deg) translate(${x}px, ${y}px)`;
                } else {
                    layer.style.transform = `translate(${x}px, ${y}px)`;
                }
            });

            requestAnimationFrame(animateParallax);
        }

        animateParallax();

        // Additional enhancement: Connecting lines between elements
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'dynamic-connections');
        svg.style.position = 'absolute';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.zIndex = '3';
        svg.style.pointerEvents = 'none';
        container.appendChild(svg);

        function createDynamicConnections() {
            svg.innerHTML = '';
            const elements = document.querySelectorAll('.element');

            elements.forEach((elem1, i) => {
                elements.forEach((elem2, j) => {
                    if (i < j && Math.random() > 0.6) {
                        const rect1 = elem1.getBoundingClientRect();
                        const rect2 = elem2.getBoundingClientRect();
                        const containerRect = container.getBoundingClientRect();

                        const x1 = rect1.left - containerRect.left + rect1.width / 2;
                        const y1 = rect1.top - containerRect.top + rect1.height / 2;
                        const x2 = rect2.left - containerRect.left + rect2.width / 2;
                        const y2 = rect2.top - containerRect.top + rect2.height / 2;

                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', x1);
                        line.setAttribute('y1', y1);
                        line.setAttribute('x2', x2);
                        line.setAttribute('y2', y2);
                        line.setAttribute('stroke', '#D4A574');
                        line.setAttribute('stroke-width', '1');
                        line.setAttribute('opacity', '0');
                        svg.appendChild(line);

                        // Animate line drawing
                        anime({
                            targets: line,
                            opacity: [0, 0.2, 0],
                            duration: 4000,
                            easing: 'easeInOutQuad',
                            complete: () => line.remove()
                        });
                    }
                });
            });
        }

        // Create dynamic connections periodically
        setInterval(createDynamicConnections, 6000);
        setTimeout(createDynamicConnections, 2000);

    </script>
</body>
</html>
