<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawaiian Circular Diagram</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            /* Animated gradient background */
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
        }

        /* Smooth gradient animation for background atmosphere */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Loading screen - displays while page initializes */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Spinning loader with Hawaiian color scheme */
        .loader {
            width: 80px;
            height: 80px;
            border: 6px solid #2d2d2d;
            border-top: 6px solid #8B1A1A;
            border-right: 6px solid #D4A574;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: #D4A574;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 800px;
            max-height: 800px;
            /* Performance: GPU acceleration for container */
            will-change: transform;
        }

        /* Central Circle - Performance optimized with will-change */
        .central-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: #8B1A1A;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(139, 26, 26, 0.5),
                        inset 0 0 20px rgba(0, 0, 0, 0.3);
            border: 4px solid #D4A574;
            z-index: 10;
            /* Performance: Optimize for transform and box-shadow animations */
            will-change: transform, box-shadow;
        }

        .bird-container {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bird-svg {
            width: 100%;
            height: 100%;
            fill: #D4A574;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Element Circles - Performance optimized for smooth interactions */
        .element {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #D4A574;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #8B1A1A;
            cursor: pointer;
            transition: transform 0.3s ease;
            /* Performance: Enable GPU acceleration for smooth scaling */
            will-change: transform;
            backface-visibility: hidden;
        }

        .element:hover {
            transform: scale(1.1);
        }

        .element-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 8px;
        }

        .element-label {
            color: #8B1A1A;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        /* Positioning elements around the circle */
        .element-top {
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .element-bottom {
            bottom: 0;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .element-left {
            left: 0;
            top: 50%;
            transform: translate(0, -50%);
        }

        .element-right {
            right: 0;
            top: 50%;
            transform: translate(0, -50%);
        }

        .element-upper-right {
            top: 12%;
            right: 12%;
        }

        .element-lower-right {
            bottom: 12%;
            right: 12%;
        }

        /* Connecting Lines */
        .connection-line {
            position: absolute;
            background: #D4A574;
            opacity: 0.3;
            z-index: 1;
        }

        .line-top {
            width: 3px;
            height: calc(50% - 100px);
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
        }

        .line-bottom {
            width: 3px;
            height: calc(50% - 100px);
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
        }

        .line-left {
            height: 3px;
            width: calc(50% - 100px);
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
        }

        .line-right {
            height: 3px;
            width: calc(50% - 100px);
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
        }

        .line-upper-right {
            width: 3px;
            height: 180px;
            top: 100px;
            right: calc(12% + 60px);
            transform: rotate(45deg);
            transform-origin: top center;
        }

        .line-lower-right {
            width: 3px;
            height: 180px;
            bottom: 100px;
            right: calc(12% + 60px);
            transform: rotate(-45deg);
            transform-origin: bottom center;
        }

        /* Geometric Patterns - Performance optimized for continuous animation */
        .pattern-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            /* Performance: Optimize for opacity and transform changes */
            will-change: opacity, transform;
        }

        /* Add floating animation for pattern container */
        @keyframes floatPattern {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            25% {
                transform: translateY(-10px) translateX(5px);
            }
            50% {
                transform: translateY(0) translateX(10px);
            }
            75% {
                transform: translateY(10px) translateX(5px);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .element {
                width: 100px;
                height: 100px;
            }

            .element-icon {
                width: 40px;
                height: 40px;
            }

            .element-label {
                font-size: 12px;
            }

            .central-circle {
                width: 160px;
                height: 160px;
            }

            .bird-container {
                width: 80px;
                height: 80px;
            }
        }

        @media (max-width: 480px) {
            .element {
                width: 80px;
                height: 80px;
            }

            .element-icon {
                width: 30px;
                height: 30px;
            }

            .element-label {
                font-size: 10px;
            }

            .central-circle {
                width: 120px;
                height: 120px;
            }

            .bird-container {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen - Displayed during initialization -->
    <div class="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">LOADING...</div>
    </div>

    <div class="container">
        <!-- Background patterns -->
        <svg class="pattern-container" xmlns="http://www.w3.org/2000/svg">
            <!-- Spiral patterns -->
            <path d="M 400 400 Q 420 380, 440 400 T 480 400 T 520 400"
                  fill="none" stroke="#8B1A1A" stroke-width="2" opacity="0.2"/>
            <path d="M 400 400 Q 380 420, 400 440 T 400 480 T 400 520"
                  fill="none" stroke="#8B1A1A" stroke-width="2" opacity="0.2"/>

            <!-- Triangles -->
            <polygon points="100,100 120,140 80,140" fill="#D4A574" opacity="0.15"/>
            <polygon points="700,100 720,140 680,140" fill="#D4A574" opacity="0.15"/>
            <polygon points="100,700 120,740 80,740" fill="#D4A574" opacity="0.15"/>
            <polygon points="700,700 720,740 680,740" fill="#D4A574" opacity="0.15"/>

            <!-- Chevrons -->
            <path d="M 50 400 L 80 380 L 80 420 Z" fill="#8B1A1A" opacity="0.2"/>
            <path d="M 750 400 L 720 380 L 720 420 Z" fill="#8B1A1A" opacity="0.2"/>
        </svg>

        <!-- Connecting lines -->
        <div class="connection-line line-top"></div>
        <div class="connection-line line-bottom"></div>
        <div class="connection-line line-left"></div>
        <div class="connection-line line-right"></div>
        <div class="connection-line line-upper-right"></div>
        <div class="connection-line line-lower-right"></div>

        <!-- Central Circle with Bird -->
        <div class="central-circle">
            <div class="bird-container">
                <svg class="bird-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Hawaiian bird (simplified 'Iwa / frigate bird) -->
                    <path d="M 50 30 Q 40 35, 20 25 Q 15 20, 20 15 Q 30 20, 40 25 L 45 35
                             Q 48 25, 50 20 Q 52 25, 55 35 L 60 25 Q 70 20, 80 15 Q 85 20, 80 25
                             Q 60 35, 50 30 Z M 50 35 L 45 55 L 50 70 L 55 55 Z
                             M 45 55 L 35 60 L 40 65 M 55 55 L 65 60 L 60 65"/>
                    <circle cx="45" cy="32" r="2"/>
                    <circle cx="55" cy="32" r="2"/>
                </svg>
            </div>
        </div>

        <!-- Element: Top -->
        <div class="element element-top">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Chevron pattern -->
                <path d="M 20 50 L 50 20 L 80 50" fill="none" stroke="#8B1A1A" stroke-width="6"/>
                <path d="M 20 70 L 50 40 L 80 70" fill="none" stroke="#8B1A1A" stroke-width="6"/>
            </svg>
            <div class="element-label">Lani<br>(Heaven)</div>
        </div>

        <!-- Element: Bottom -->
        <div class="element element-bottom">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Triangle pattern -->
                <polygon points="50,20 80,70 20,70" fill="#8B1A1A"/>
                <polygon points="50,40 65,70 35,70" fill="#D4A574"/>
            </svg>
            <div class="element-label">Honua<br>(Earth)</div>
        </div>

        <!-- Element: Left -->
        <div class="element element-left">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Spiral pattern -->
                <path d="M 50 50 Q 50 30, 70 30 Q 80 30, 80 40 Q 80 60, 60 60 Q 30 60, 30 40 Q 30 20, 50 20"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
                <circle cx="50" cy="50" r="5" fill="#8B1A1A"/>
            </svg>
            <div class="element-label">Kai<br>(Ocean)</div>
        </div>

        <!-- Element: Right -->
        <div class="element element-right">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Geometric pattern -->
                <rect x="30" y="30" width="15" height="15" fill="#8B1A1A"/>
                <rect x="55" y="30" width="15" height="15" fill="#8B1A1A"/>
                <rect x="30" y="55" width="15" height="15" fill="#8B1A1A"/>
                <rect x="55" y="55" width="15" height="15" fill="#8B1A1A"/>
                <circle cx="50" cy="50" r="8" fill="#8B1A1A"/>
            </svg>
            <div class="element-label">Aina<br>(Land)</div>
        </div>

        <!-- Element: Upper Right -->
        <div class="element element-upper-right">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Sun rays -->
                <circle cx="50" cy="50" r="15" fill="#8B1A1A"/>
                <line x1="50" y1="20" x2="50" y2="30" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="50" y1="70" x2="50" y2="80" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="20" y1="50" x2="30" y2="50" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="70" y1="50" x2="80" y2="50" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="30" y1="30" x2="37" y2="37" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="63" y1="63" x2="70" y2="70" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="70" y1="30" x2="63" y2="37" stroke="#8B1A1A" stroke-width="4"/>
                <line x1="37" y1="63" x2="30" y2="70" stroke="#8B1A1A" stroke-width="4"/>
            </svg>
            <div class="element-label">La<br>(Sun)</div>
        </div>

        <!-- Element: Lower Right -->
        <div class="element element-lower-right">
            <svg class="element-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Wave pattern -->
                <path d="M 10 40 Q 25 30, 40 40 T 70 40 T 90 40"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
                <path d="M 10 55 Q 25 45, 40 55 T 70 55 T 90 55"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
                <path d="M 10 70 Q 25 60, 40 70 T 70 70 T 90 70"
                      fill="none" stroke="#8B1A1A" stroke-width="5"/>
            </svg>
            <div class="element-label">Mana<br>(Spirit)</div>
        </div>
    </div>

    <script>
        // ====================================================================
        // CUSTOM EASING FUNCTIONS
        // ====================================================================
        // Define custom cubic-bezier easing for smooth, natural motion
        // Format: cubic-bezier(x1, y1, x2, y2) - control points for Bézier curve

        const customEasing = {
            // Smooth elastic bounce - great for appearing elements
            elasticOut: 'cubicBezier(0.68, -0.55, 0.265, 1.55)',
            // Gentle spring effect - natural feeling motion
            spring: 'spring(1, 80, 10, 0)',
            // Smooth deceleration - polished exits
            smoothOut: 'cubicBezier(0.25, 0.46, 0.45, 0.94)',
            // Quick acceleration with smooth finish
            quickSnap: 'cubicBezier(0.4, 0.0, 0.2, 1)',
            // Anticipation effect - pulls back before moving forward
            anticipate: 'cubicBezier(0.36, 0, 0.66, -0.56)'
        };

        // ====================================================================
        // LOADING ANIMATION & PAGE INITIALIZATION
        // ====================================================================
        // Hide loading screen after a brief delay to ensure smooth transitions
        // This creates a professional loading experience

        window.addEventListener('load', function() {
            // Small delay ensures all resources are ready
            setTimeout(() => {
                const loadingScreen = document.querySelector('.loading-screen');
                loadingScreen.classList.add('hidden');

                // Start main animation sequence after loading screen fades
                setTimeout(() => {
                    initIntroSequence();
                }, 500);
            }, 800);
        });

        // ====================================================================
        // INTRO SEQUENCE - Initial appearance of all elements
        // ====================================================================
        // Animation sequence: Central circle → Connection lines → Element circles
        // Uses elastic easing for playful, energetic entrance

        function initIntroSequence() {
            const introTimeline = anime.timeline({
                loop: false,
                easing: 'easeOutElastic(1, .8)'
            });

            // STEP 1: Central circle appears with elastic bounce
            // Scale from 0 to 1 creates a "pop" effect
            introTimeline.add({
                targets: '.central-circle',
                scale: [0, 1],
                opacity: [0, 1],
                duration: 1000,
                easing: 'easeOutElastic(1, .8)',
                begin: function() {
                    // Ensure element is visible before animation starts
                    document.querySelector('.central-circle').style.opacity = 1;
                }
            });

            // STEP 2: Connection lines grow from center outward
            // Stagger creates sequential appearance (200ms between each line)
            introTimeline.add({
                targets: '.connection-line',
                scaleY: [0, 1],
                opacity: [0, 0.3],
                duration: 700,
                delay: anime.stagger(150),
                easing: 'easeOutCubic'
            }, '-=500'); // Start 500ms before previous animation ends (overlap)

            // STEP 3: Element circles appear with staggered elastic bounce
            // from: 'center' makes closest elements appear first
            introTimeline.add({
                targets: '.element',
                scale: [0, 1],
                opacity: [0, 1],
                duration: 800,
                delay: anime.stagger(150, {from: 'center'}),
                easing: 'easeOutElastic(1, .6)',
                complete: function() {
                    // After intro completes, start idle state animations
                    initIdleState();
                }
            }, '-=400');
        }

        // ====================================================================
        // IDLE STATE - Continuous subtle animations when no interaction
        // ====================================================================
        // These animations create a "living" feeling without being distracting
        // All use smooth, slow easings for calm, meditative effect

        function initIdleState() {
            // BIRD ROTATION: Slow, continuous 360° rotation (8 seconds per rotation)
            // easeInOutQuad provides smooth acceleration and deceleration
            anime({
                targets: '.bird-svg',
                rotate: 360,
                duration: 8000,
                loop: true,
                easing: 'easeInOutQuad'
            });

            // CENTRAL CIRCLE GLOW PULSE: Creates breathing effect
            // Alternates between subtle and prominent shadow
            anime({
                targets: '.central-circle',
                boxShadow: [
                    '0 0 30px rgba(139, 26, 26, 0.5)',
                    '0 0 50px rgba(139, 26, 26, 0.8)',
                    '0 0 30px rgba(139, 26, 26, 0.5)'
                ],
                duration: 3000,
                loop: true,
                easing: 'easeInOutSine' // Sine wave creates natural breathing rhythm
            });

            // ELEMENT SUBTLE FLOAT: Gentle up/down motion
            // Adds life to static elements without being distracting
            anime({
                targets: '.element',
                translateY: [0, -5, 0],
                duration: 4000,
                loop: true,
                delay: anime.stagger(300), // Each element floats at different times
                easing: 'easeInOutSine'
            });

            // PATTERN STROKE ANIMATION: Line drawing effect
            // Creates hypnotic, flowing motion in background patterns
            initPatternAnimations();

            // BACKGROUND PATTERN MOVEMENT: Subtle floating motion
            // Adds depth and dimension to the background
            anime({
                targets: '.pattern-container',
                translateY: [0, -10, 0],
                translateX: [0, 5, 0],
                duration: 20000,
                loop: true,
                easing: 'easeInOutSine'
            });
        }

        // ====================================================================
        // PATTERN ANIMATIONS - Background geometric pattern effects
        // ====================================================================
        // Animate SVG stroke paths to create drawing effect
        // Opacity pulsing adds visual interest without distraction

        function initPatternAnimations() {
            // Setup stroke dasharray for line drawing animation
            // This technique makes paths appear to "draw themselves"
            const paths = document.querySelectorAll('.pattern-container path');
            paths.forEach(path => {
                const pathLength = path.getTotalLength();
                path.style.strokeDasharray = pathLength;
                path.style.strokeDashoffset = pathLength;
            });

            // STROKE DRAWING: Paths draw and undraw continuously
            // alternate direction creates seamless loop
            anime({
                targets: '.pattern-container path',
                strokeDashoffset: [anime.setDashoffset, 0],
                duration: 3000,
                delay: anime.stagger(400), // Sequential drawing
                easing: 'easeInOutQuad',
                loop: true,
                direction: 'alternate'
            });

            // POLYGON OPACITY PULSE: Subtle fade in/out
            // Creates gentle twinkling effect
            anime({
                targets: '.pattern-container polygon',
                opacity: [0.15, 0.3, 0.15],
                duration: 4000,
                loop: true,
                easing: 'easeInOutSine',
                delay: anime.stagger(300)
            });
        }

        // ====================================================================
        // INTERACTION STATES - Mouse hover and click responses
        // ====================================================================
        // These animations provide immediate feedback to user actions
        // Using spring physics creates natural, satisfying interactions

        // Setup hover interactions for all element circles
        document.querySelectorAll('.element').forEach(element => {
            // HOVER ENTER: Scale up with spring bounce
            element.addEventListener('mouseenter', function() {
                // Stop any ongoing idle float animation for this element
                anime.remove(this);

                // Scale element to 1.15x with spring easing
                // Spring physics creates satisfying bounce
                anime({
                    targets: this,
                    scale: 1.15,
                    duration: 600,
                    easing: 'spring(1, 80, 10, 0)' // Spring with natural bounce
                });

                // Rotate icon 360° with smooth ease
                // Creates playful, engaging interaction
                anime({
                    targets: this.querySelector('.element-icon'),
                    rotate: [0, 360],
                    duration: 800,
                    easing: 'easeInOutCubic'
                });

                // Brighten element shadow for depth
                anime({
                    targets: this,
                    boxShadow: '0 8px 25px rgba(0, 0, 0, 0.5)',
                    duration: 300,
                    easing: 'easeOutQuad'
                });
            });

            // HOVER LEAVE: Return to normal state
            element.addEventListener('mouseleave', function() {
                // Smooth return to idle state
                anime({
                    targets: this,
                    scale: 1,
                    duration: 400,
                    easing: 'easeOutCubic'
                });

                // Restore original shadow
                anime({
                    targets: this,
                    boxShadow: '0 4px 15px rgba(0, 0, 0, 0.3)',
                    duration: 300,
                    easing: 'easeOutQuad'
                });

                // Resume idle float animation
                anime({
                    targets: this,
                    translateY: [0, -5, 0],
                    duration: 4000,
                    loop: true,
                    easing: 'easeInOutSine'
                });
            });

            // CLICK: Emphatic bounce feedback
            element.addEventListener('click', function() {
                // Quick scale down then up creates "press" effect
                anime({
                    targets: this,
                    scale: [1.15, 0.95, 1.15],
                    duration: 400,
                    easing: 'easeOutElastic(1, .5)'
                });

                // Flash effect on icon
                anime({
                    targets: this.querySelector('.element-icon'),
                    opacity: [1, 0.5, 1],
                    duration: 300,
                    easing: 'easeInOutQuad'
                });
            });
        });

        // ====================================================================
        // CENTRAL CIRCLE INTERACTION - Special hover effect for main element
        // ====================================================================
        const centralCircle = document.querySelector('.central-circle');

        centralCircle.addEventListener('mouseenter', function() {
            // Grow central circle and intensify glow
            anime({
                targets: this,
                scale: 1.05,
                duration: 500,
                easing: 'easeOutElastic(1, .8)'
            });

            // Speed up bird rotation on hover for playful interaction
            anime.remove('.bird-svg'); // Stop current rotation
            anime({
                targets: '.bird-svg',
                rotate: 360,
                duration: 2000, // Faster than idle (was 8000)
                loop: true,
                easing: 'linear'
            });
        });

        centralCircle.addEventListener('mouseleave', function() {
            // Return to normal size
            anime({
                targets: this,
                scale: 1,
                duration: 500,
                easing: 'easeOutCubic'
            });

            // Restore normal bird rotation speed
            anime.remove('.bird-svg');
            anime({
                targets: '.bird-svg',
                rotate: 360,
                duration: 8000,
                loop: true,
                easing: 'easeInOutQuad'
            });
        });

        // ====================================================================
        // PERFORMANCE OPTIMIZATION
        // ====================================================================
        // Monitor frame rate and adjust animation quality if needed
        // Ensures 60fps on all devices

        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 60;

        function checkPerformance() {
            frameCount++;
            const currentTime = performance.now();

            // Calculate FPS every second
            if (currentTime >= lastTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                frameCount = 0;
                lastTime = currentTime;

                // If FPS drops below 50, reduce animation complexity
                if (fps < 50) {
                    console.log('Performance optimization: Reducing animation complexity');
                    // Disable some background animations
                    anime.remove('.pattern-container');
                }
            }

            requestAnimationFrame(checkPerformance);
        }

        // Start performance monitoring
        requestAnimationFrame(checkPerformance);

        // ====================================================================
        // ACCESSIBILITY - Respect user's motion preferences
        // ====================================================================
        // Disable animations if user prefers reduced motion

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            // Stop all anime.js animations
            anime.running.forEach(anim => anim.pause());
            console.log('Reduced motion mode: Animations paused');
        }
    </script>
</body>
